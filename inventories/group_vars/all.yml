  - name: omvormer-wired
    mac: "2c:bc:bb:5d:0b:f3"
    ip: "192.168.4.3"

# Modbus whitelist — mogen het .4.0/24 segment bereiken
nanopirouter_modbus_whitelist:
  - "192.168.3.8"   # homeassistant
  - "192.168.3.11"  # pihole
  - "192.168.3.28"  # windows-laptop
  - "192.168.3.41"  # linux box
  - "192.168.3.50"  # pixel8pro
  - "192.168.3.51"  # fp4

# WireGuard
nanopirouter_wg_interface: "wg0"
nanopirouter_wg_port: 51820
nanopirouter_wg_server_ip: "10.8.0.1/24"
nanopirouter_wg_subnet: "10.8.0.0/24"

# --- PiHole
pihole_hostname: "pihole-ansible"
pihole_version: "latest"
pihole_project: "pihole-stack-ansible"
pihole_stack_dir: "{{ base_dir }}/pihole-stack-ansible"
pihole_etc_dir: "{{ pihole_stack_dir }}/data/pihole-etc"
pihole_dnsmasq_dir: "{{ pihole_stack_dir }}/data/dnsmasq-etc"
pihole_backup_dir: "/mnt/backup/pihole"
pihole_config_repo_dir: "{{ config_repo_path }}/pihole"
pihole_container_name: pihole_ansible
pihole_host_port_http: 80
pihole_host_port_https: 443
pihole_host_port_dns: 53
pihole_seedbox_network: "192.168.3.0/24"
pihole_web_password: "{{ lookup('env', 'PIHOLE_WEB_PASSWORD') }}"

# --- NetAlertX
netalertx_version: "latest"
netalertx_container_name: netalertx_ansible
netalertx_port: 20211
netalertx_data_dir: "{{ pihole_stack_dir }}/data/netalertx"
netalertx_lan_interface: "eth0"
netalertx_scan_subnets: "192.168.3.0/24 --interface={{ netalertx_lan_interface }}"
netalertx_app_password: "{{ lookup('env', 'NETALERTX_APP_PASSWORD') }}"
