---
- name: Detect NetworkManager service name
  ansible.builtin.shell: |
    systemctl list-unit-files --type=service --no-legend \
      | awk '{print $1}' \
      | grep -Ei '^(NetworkManager|network-manager)\.service$' \
      | head -1 | sed 's/\.service//'
  register: nm_service_name_result
  changed_when: false
  failed_when: nm_service_name_result.stdout | length == 0

- name: Set NetworkManager service name fact
  ansible.builtin.set_fact:
    nm_service_name: "{{ nm_service_name_result.stdout }}"

- name: Ensure NetworkManager is running
  ansible.builtin.systemd:
    name: "{{ nm_service_name }}"
    enabled: true
    state: started

- name: Enable IP forwarding
  ansible.builtin.sysctl:
    name: "{{ item }}"
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.disable_ipv6

- name: Deploy netplan config for router interfaces
  ansible.builtin.template:
    src: netplan-router.yaml.j2
    dest: /etc/netplan/10-router.yaml
    mode: "0600"
  register: netplan_config

- name: Remove default Armbian netplan config if present
  ansible.builtin.file:
    path: /etc/netplan/00-default.yaml
    state: absent
  register: netplan_default_removed

- name: Apply netplan if config changed
  ansible.builtin.command: netplan apply
  changed_when: true
  when: netplan_config is changed or netplan_default_removed is changed

- name: Ensure LAN interface is up with correct IP
  ansible.builtin.shell: |
    ip link set {{ nanopirouter_lan_interface }} up
    ip addr show {{ nanopirouter_lan_interface }} | grep -q '{{ nanopirouter_lan_ip }}' || \
      ip addr add {{ nanopirouter_lan_ip }}/24 dev {{ nanopirouter_lan_interface }}
  changed_when: false

- name: Verify LAN interface has IP address
  ansible.builtin.shell: ip addr show {{ nanopirouter_lan_interface }} | grep -q 'inet '
  changed_when: false

