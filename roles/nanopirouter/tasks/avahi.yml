---
- name: Install avahi-daemon
  ansible.builtin.apt:
    name: avahi-daemon
    state: present
    update_cache: false

- name: Configure avahi-daemon (mDNS reflector lan1 ↔ lan2)
  ansible.builtin.template:
    src: avahi-daemon.conf.j2
    dest: /etc/avahi/avahi-daemon.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart avahi-daemon

- name: Enable and start avahi-daemon
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started
