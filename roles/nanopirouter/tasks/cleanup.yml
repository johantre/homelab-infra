---
# Verwijder overblijfselen van deprecated features

- name: Stop en verwijder dantherm-relay service (deprecated)
  ansible.builtin.systemd:
    name: dantherm-relay
    state: stopped
    enabled: false
    daemon_reload: true
  failed_when: false

- name: Verwijder dantherm-relay service file (deprecated)
  ansible.builtin.file:
    path: /etc/systemd/system/dantherm-relay.service
    state: absent

- name: Verwijder dantherm-relay script (deprecated)
  ansible.builtin.file:
    path: /usr/local/bin/dantherm-relay.py
    state: absent

- name: Stop en disable avahi-daemon (deprecated)
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    - avahi-daemon.service
    - avahi-daemon.socket
  failed_when: false

- name: Verwijder avahi-daemon package (deprecated)
  ansible.builtin.apt:
    name:
      - avahi-daemon
      - libavahi-core7
    state: absent
    purge: true
