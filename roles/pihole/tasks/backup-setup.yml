---
# Deploy backup + git sync for PiHole
#
# Flow:
#   pihole.toml wijzigt  →  pihole-config-watch.path
#                        →  pihole-backup-flag.service (touch /run/pihole-backup-pending)
#   elke nacht 03:00     →  pihole-backup.timer
#                        →  pihole-backup.service  (runs als vlag aanwezig OF dag 1)

- name: Install git (required for git sync)
  ansible.builtin.apt:
    name: git
    state: present
    update_cache: false
  become: true

- name: Deploy lease sync SSH private key
  ansible.builtin.copy:
    content: "{{ lease_sync_key_b64 | b64decode }}"
    dest: "{{ ansible_env.HOME }}/.ssh/id_ed25519_lease_sync"
    mode: "0600"
  no_log: true

- name: Add NanoPi host key to known_hosts
  ansible.builtin.known_hosts:
    name: "{{ nanopirouter_lan_ip }}"
    key: "{{ lookup('pipe', 'ssh-keyscan -t ed25519 ' + nanopirouter_lan_ip + ' 2>/dev/null') }}"
    path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
    state: present

- name: Create lease file placeholder (required before container starts)
  ansible.builtin.file:
    path: "{{ netalertx_leases_host_path }}"
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  become: true

- name: Deploy netalertx-lease-sync.service
  ansible.builtin.template:
    src: netalertx-lease-sync.service.j2
    dest: /etc/systemd/system/netalertx-lease-sync.service
    mode: "0644"
  become: true
  notify: reload systemd

- name: Deploy netalertx-lease-sync.timer
  ansible.builtin.copy:
    src: netalertx-lease-sync.timer
    dest: /etc/systemd/system/netalertx-lease-sync.timer
    mode: "0644"
  become: true
  notify: reload systemd

- name: Deploy pihole-backup.sh
  ansible.builtin.template:
    src: pihole-backup.sh.j2
    dest: /usr/local/bin/pihole-backup.sh
    mode: "0750"
    owner: root
    group: root
  become: true

- name: Deploy credentials env file
  ansible.builtin.template:
    src: pihole-backup.env.j2
    dest: /etc/pihole-backup.env
    mode: "0600"
    owner: root
    group: root
  become: true
  no_log: true

- name: Deploy pihole-backup.service
  ansible.builtin.copy:
    src: pihole-backup.service
    dest: /etc/systemd/system/pihole-backup.service
    mode: "0644"
  become: true
  notify: reload systemd

- name: Deploy pihole-backup.timer
  ansible.builtin.copy:
    src: pihole-backup.timer
    dest: /etc/systemd/system/pihole-backup.timer
    mode: "0644"
  become: true
  notify: reload systemd

- name: Deploy pihole-backup-flag.service
  ansible.builtin.copy:
    src: pihole-backup-flag.service
    dest: /etc/systemd/system/pihole-backup-flag.service
    mode: "0644"
  become: true
  notify: reload systemd

- name: Deploy pihole-config-watch.path
  ansible.builtin.template:
    src: pihole-config-watch.path.j2
    dest: /etc/systemd/system/pihole-config-watch.path
    mode: "0644"
  become: true
  notify: reload systemd

- name: Deploy netalertx-config-watch.path
  ansible.builtin.template:
    src: netalertx-config-watch.path.j2
    dest: /etc/systemd/system/netalertx-config-watch.path
    mode: "0644"
  become: true
  notify: reload systemd

- name: Flush handlers (reload systemd before enabling units)
  ansible.builtin.meta: flush_handlers

- name: Enable and start pihole-backup.timer
  ansible.builtin.systemd:
    name: pihole-backup.timer
    enabled: true
    state: started
    daemon_reload: false
  become: true

- name: Enable and start pihole-config-watch.path
  ansible.builtin.systemd:
    name: pihole-config-watch.path
    enabled: true
    state: started
    daemon_reload: false
  become: true

- name: Enable and start netalertx-config-watch.path
  ansible.builtin.systemd:
    name: netalertx-config-watch.path
    enabled: true
    state: started
    daemon_reload: false
  become: true

- name: Enable and start netalertx-lease-sync.timer
  ansible.builtin.systemd:
    name: netalertx-lease-sync.timer
    enabled: true
    state: started
    daemon_reload: false
  become: true
