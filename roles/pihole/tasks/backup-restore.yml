---
# PiHole backup restore - restore from local tar.gz backup
#
# Backup format: tar.gz containing:
#   ./gravity.db    → blocklists + custom DNS
#   ./pihole.toml   → full PiHole configuration
#
# Restores both files into pihole_etc_dir while container is stopped.

- name: Find all backups in pihole backup directory
  ansible.builtin.find:
    paths: "{{ pihole_backup_dir }}"
    patterns: "pihole-backup-*.tar.gz"
    file_type: file
  register: backup_files

- name: Fail if no backups found
  ansible.builtin.fail:
    msg: "❌ No backup files found in {{ pihole_backup_dir }}"
  when: backup_files.matched == 0

- name: Select newest backup
  ansible.builtin.set_fact:
    latest_backup: "{{ backup_files.files | sort(attribute='mtime', reverse=True) | first }}"

- name: Show selected backup
  ansible.builtin.debug:
    msg:
      - "Selected backup: {{ latest_backup.path | basename }}"
      - "Size: {{ (latest_backup.size / 1024 / 1024) | round(2) }} MB"

- name: Create temporary restore directory
  ansible.builtin.file:
    path: /tmp/pihole-restore
    state: directory
    mode: "0700"

- name: Extract backup archive
  ansible.builtin.unarchive:
    src: "{{ latest_backup.path }}"
    dest: /tmp/pihole-restore/
    remote_src: true

- name: Verify gravity.db exists in backup
  ansible.builtin.stat:
    path: /tmp/pihole-restore/gravity.db
  register: gravity_stat

- name: Fail if gravity.db missing in backup
  ansible.builtin.fail:
    msg: "❌ gravity.db not found in backup {{ latest_backup.path | basename }}"
  when: not gravity_stat.stat.exists

- name: Stop PiHole container before restore
  ansible.builtin.shell: |
    sg docker -c 'docker stop {{ pihole_container_name }}'
  changed_when: true
  ignore_errors: true

- name: Restore gravity.db via Python sqlite3 backup API
  ansible.builtin.shell: |
    python3 -c "
    import sqlite3, os
    src = sqlite3.connect('/tmp/pihole-restore/gravity.db')
    src.execute('PRAGMA wal_checkpoint(TRUNCATE)')
    for f in ['{{ pihole_etc_dir }}/gravity.db', '{{ pihole_etc_dir }}/gravity.db-wal', '{{ pihole_etc_dir }}/gravity.db-shm']:
        if os.path.exists(f):
            os.remove(f)
    dst = sqlite3.connect('{{ pihole_etc_dir }}/gravity.db')
    src.backup(dst)
    dst.close()
    src.close()
    "
    chmod 644 {{ pihole_etc_dir }}/gravity.db
  changed_when: true

- name: Check if pihole.toml exists in backup
  ansible.builtin.stat:
    path: /tmp/pihole-restore/pihole.toml
  register: toml_stat

- name: Restore pihole.toml
  ansible.builtin.copy:
    src: /tmp/pihole-restore/pihole.toml
    dest: "{{ pihole_etc_dir }}/pihole.toml"
    remote_src: true
    mode: "0644"
  when: toml_stat.stat.exists

- name: Start PiHole container after restore
  ansible.builtin.shell: |
    sg docker -c 'docker start {{ pihole_container_name }}'
  changed_when: true

- name: Wait for PiHole web interface to come up
  ansible.builtin.uri:
    url: "http://localhost:{{ pihole_host_port_http }}/admin/"
    status_code: [200, 301, 302]
    timeout: 5
  register: pihole_ping
  retries: 30
  delay: 2
  until: pihole_ping.status in [200, 301, 302]
  ignore_errors: true

- name: Backup restore summary
  ansible.builtin.debug:
    msg:
      - "✅ PiHole backup restored from {{ latest_backup.path | basename }}"
      - "   gravity.db → {{ pihole_etc_dir }}"
      - "   pihole.toml → {{ pihole_etc_dir }}"

- name: Remove temporary restore directory
  ansible.builtin.file:
    path: /tmp/pihole-restore
    state: absent
  failed_when: false
