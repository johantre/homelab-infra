---
- name: Check if running on Raspberry Pi (ARM)
  ansible.builtin.set_fact:
    is_raspberry_pi: "{{ ansible_architecture in ['aarch64', 'armv7l', 'armv6l'] }}"

- name: Disable WiFi via boot config (Raspberry Pi)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay=disable-wifi"
    state: present
  become: true
  register: wifi_disabled
  when: is_raspberry_pi

- name: Disable Bluetooth via boot config (Raspberry Pi)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay=disable-bt"
    state: present
  become: true
  register: bt_disabled
  when: is_raspberry_pi

- name: Reboot to apply WiFi/BT changes
  ansible.builtin.reboot:
    reboot_timeout: 120
    msg: "Rebooting to apply WiFi/BT disable"
  become: true
  when:
    - is_raspberry_pi
    - wifi_disabled.changed or bt_disabled.changed
