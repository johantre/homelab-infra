---
# Enforce critical NetAlertX settings in app.conf that docker-compose env vars do NOT apply:
#   - SETPWD_enable_password / SETPWD_password  (auth)
#   - SCAN_SUBNETS                              (network scan scope)
# Fix: write a script (ubuntu-owned), run via docker exec (uid 20211), restart only if changed.

- name: Wait for NetAlertX app.conf to be initialized
  ansible.builtin.wait_for:
    path: "{{ netalertx_config_dir }}/app.conf"
    timeout: 120

- name: Write NetAlertX settings enforcement script
  no_log: true
  ansible.builtin.copy:
    dest: /tmp/netalertx-enforce.sh
    mode: "0755"
    content: |
      #!/bin/bash
      set -e
      CONTAINER="{{ netalertx_container_name }}"
      HASH='{{ netalertx_app_password | hash("sha256") }}'
      SUBNETS='{{ netalertx_scan_subnets }}'
      CONF=/data/config/app.conf
      CHANGED=0

      enforce_setting() {
        local KEY="$1" VAL="$2"
        if ! docker exec "$CONTAINER" grep -qF "${KEY}=${VAL}" "$CONF"; then
          if docker exec "$CONTAINER" grep -q "^${KEY}=" "$CONF"; then
            docker exec "$CONTAINER" sed -i "s|^${KEY}=.*|${KEY}=${VAL}|" "$CONF"
          else
            docker exec "$CONTAINER" bash -c "echo '${KEY}=${VAL}' >> $CONF"
          fi
          CHANGED=1
        fi
      }

      enforce_setting "SETPWD_enable_password" "True"
      enforce_setting "SETPWD_password" "'$HASH'"
      enforce_setting "SCAN_SUBNETS" "$SUBNETS"

      echo $CHANGED

- name: Enforce NetAlertX settings in app.conf
  ansible.builtin.shell: sg docker -c 'bash /tmp/netalertx-enforce.sh'
  register: _enforce_result
  changed_when: _enforce_result.stdout | trim == '1'

- name: Remove enforcement script
  ansible.builtin.file:
    path: /tmp/netalertx-enforce.sh
    state: absent

- name: Restart NetAlertX to apply settings
  ansible.builtin.shell: sg docker -c 'docker restart {{ netalertx_container_name }}'
  when: _enforce_result is changed
