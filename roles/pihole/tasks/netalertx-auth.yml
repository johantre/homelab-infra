---
# Enforce critical NetAlertX settings in app.conf that docker-compose env vars do NOT apply:
#   - SETPWD_enable_password / SETPWD_password  (auth)   → via docker exec bash script
#   - SCAN_SUBNETS                              (subnets) → via lineinfile (value contains quotes)

- name: Wait for NetAlertX app.conf to be initialized
  ansible.builtin.wait_for:
    path: "{{ netalertx_config_dir }}/app.conf"
    timeout: 120

- name: Write NetAlertX SETPWD enforcement script
  no_log: true
  ansible.builtin.copy:
    dest: /tmp/netalertx-setpwd.sh
    mode: "0755"
    content: |
      #!/bin/bash
      set -e
      CONTAINER="{{ netalertx_container_name }}"
      HASH='{{ netalertx_app_password | hash("sha256") }}'
      CONF=/data/config/app.conf
      CHANGED=0

      if ! docker exec "$CONTAINER" grep -q "SETPWD_enable_password=True" "$CONF"; then
        if docker exec "$CONTAINER" grep -q "SETPWD_enable_password=" "$CONF"; then
          docker exec "$CONTAINER" sed -i 's/SETPWD_enable_password=.*/SETPWD_enable_password=True/' "$CONF"
        else
          docker exec "$CONTAINER" bash -c "echo 'SETPWD_enable_password=True' >> $CONF"
        fi
        CHANGED=1
      fi

      if ! docker exec "$CONTAINER" grep -qF "SETPWD_password='$HASH'" "$CONF"; then
        if docker exec "$CONTAINER" grep -q "SETPWD_password=" "$CONF"; then
          docker exec "$CONTAINER" bash -c "sed -i \"s/SETPWD_password=.*/SETPWD_password='$HASH'/\" $CONF"
        else
          docker exec "$CONTAINER" bash -c "echo \"SETPWD_password='$HASH'\" >> $CONF"
        fi
        CHANGED=1
      fi

      echo $CHANGED

- name: Enforce NetAlertX SETPWD auth settings
  ansible.builtin.shell: sg docker -c 'bash /tmp/netalertx-setpwd.sh'
  register: _setpwd_result
  changed_when: _setpwd_result.stdout | trim == '1'

- name: Remove SETPWD enforcement script
  ansible.builtin.file:
    path: /tmp/netalertx-setpwd.sh
    state: absent

- name: Enforce SCAN_SUBNETS in NetAlertX app.conf
  ansible.builtin.lineinfile:
    path: "{{ netalertx_config_dir }}/app.conf"
    regexp: '^SCAN_SUBNETS='
    line: "SCAN_SUBNETS={{ netalertx_scan_subnets }}"
  become: true
  register: _scan_subnets_result

- name: Enforce AVAHISCAN_RUN in NetAlertX app.conf
  ansible.builtin.lineinfile:
    path: "{{ netalertx_config_dir }}/app.conf"
    regexp: '^AVAHISCAN_RUN='
    line: "AVAHISCAN_RUN='before_name_updates'"
  become: true
  register: _avahiscan_result

- name: Enforce DIGSCAN_RUN in NetAlertX app.conf
  ansible.builtin.lineinfile:
    path: "{{ netalertx_config_dir }}/app.conf"
    regexp: '^DIGSCAN_RUN='
    line: "DIGSCAN_RUN='before_name_updates'"
  become: true
  register: _digscan_result

- name: Enforce DHCPLSS_RUN in NetAlertX app.conf
  ansible.builtin.lineinfile:
    path: "{{ netalertx_config_dir }}/app.conf"
    regexp: '^DHCPLSS_RUN='
    line: "DHCPLSS_RUN='schedule'"
  become: true
  register: _dhcplss_run_result

- name: Enforce DHCPLSS_RUN_SCHD in NetAlertX app.conf
  ansible.builtin.lineinfile:
    path: "{{ netalertx_config_dir }}/app.conf"
    regexp: '^DHCPLSS_RUN_SCHD='
    line: "DHCPLSS_RUN_SCHD='*/5 * * * *'"
  become: true
  register: _dhcplss_schd_result

- name: Enforce DHCPLSS_paths_to_check in NetAlertX app.conf
  ansible.builtin.lineinfile:
    path: "{{ netalertx_config_dir }}/app.conf"
    regexp: '^DHCPLSS_paths_to_check='
    line: "DHCPLSS_paths_to_check=['/etc/dnsmasq/dhcp.leases']"
  become: true
  register: _dhcplss_paths_result

- name: Restart NetAlertX to apply settings
  ansible.builtin.shell: sg docker -c 'docker restart {{ netalertx_container_name }}'
  when: >
    _setpwd_result is changed or
    _scan_subnets_result is changed or
    _avahiscan_result is changed or
    _digscan_result is changed or
    _dhcplss_run_result is changed or
    _dhcplss_schd_result is changed or
    _dhcplss_paths_result is changed
