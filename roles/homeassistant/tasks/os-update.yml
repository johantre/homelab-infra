# Third-party apt signing keys (e.g. GitHub CLI) rotate/expire server-side.
# A stale local keyring makes apt print an unverified-signature warning that
# the apt module treats as a hard cache-update failure, breaking this whole
# play. Refresh it unconditionally before updating the cache so rotation
# never breaks the pipeline again.
- name: Check if GitHub CLI apt source is configured
  stat:
    path: /etc/apt/sources.list.d/github-cli.list
  register: _github_cli_source

- name: Keep GitHub CLI apt signing key current
  become: true
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /usr/share/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"
    force: true
  when: _github_cli_source.stat.exists

- name: Update apt cache
  become: true
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade packages (safe, no dist-upgrade)
  become: true
  apt:
    upgrade: yes

- name: Install unattended-upgrades (optional)
  become: true
  apt:
    name: unattended-upgrades
    state: present

# Optional: auto-remove old packages
- name: Autoremove unused packages
  become: true
  apt:
    autoremove: true

# Reboot if required (Ubuntu drops /var/run/reboot-required)
- name: Check if reboot required
  become: true
  stat:
    path: /var/run/reboot-required
  register: reboot_flag

- name: Reboot if required
  become: true
  reboot:
    msg: "Reboot triggered by Ansible after OS updates"
    reboot_timeout: 900
  when: reboot_flag.stat.exists