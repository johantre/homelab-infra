---
- name: Check if running on Raspberry Pi (ARM)
  ansible.builtin.set_fact:
    is_raspberry_pi: "{{ ansible_architecture in ['aarch64', 'armv7l', 'armv6l'] }}"

- name: Disable Bluetooth via boot config (Raspberry Pi)
  ansible.builtin.lineinfile:
    path: /boot/firmware/config.txt
    line: "dtoverlay=disable-bt"
    state: present
  become: true
  register: bt_disabled
  when: is_raspberry_pi

- name: Flag reboot required
  ansible.builtin.set_fact:
    rpi_reboot_required: "{{ bt_disabled.changed }}"
  when: is_raspberry_pi
